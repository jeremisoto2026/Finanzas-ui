<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="220" height="62" viewBox="0 0 220 62" role="img" aria-labelledby="title">
  <title id="title">Finanzas</title>
  <defs>
    <clipPath id="wordmark"><rect x="75" y="0" width="145" height="62"/></clipPath>
    <filter id="dark-wordmark" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.09 0 0 0 0 0.16 0 0 0 1 0"/>
    </filter>
  </defs>
  <image width="220" height="62" href="/finanzas-logo-horizontal-dark.webp" xlink:href="/finanzas-logo-horizontal-dark.webp"/>
  <g clip-path="url(#wordmark)">
    <image width="220" height="62" filter="url(#dark-wordmark)" href="/finanzas-logo-horizontal-dark.webp" xlink:href="/finanzas-logo-horizontal-dark.webp"/>
  </g>
</svg>