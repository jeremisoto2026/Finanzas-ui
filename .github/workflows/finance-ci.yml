name: Finanzas CI

on:
  push:
    branches:
      - feat/finance-core-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: finance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run financial calculation tests
        run: npm test

      - name: Build application
        run: npm run build
